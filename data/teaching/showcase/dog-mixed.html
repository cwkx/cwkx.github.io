  pair(a,b);
  const aa=[...a.querySelectorAll('*')],bb=[...b.querySelectorAll('*')];
  if(aa.length===bb.length&&aa.every((n,j)=>n.tagName===bb[j].tagName))aa.forEach((n,j)=>pair(n,bb[j]));
 }
 return plans;
}
function drawTween(plans,fraction){
 for(const p of plans){let value=p.parts[0];for(let j=0;j<p.values.length;j++)value+=(p.values[j]+fraction*p.delta[j]).toFixed(3)+p.parts[j+1];p.node.setAttribute(p.name,value);}
}

const scene=document.getElementById('scene'),scrub=document.getElementById('scrub'),play=document.getElementById('play');
let index=0,playing=false,last=null,playhead=0,loaded=-1,plans=[];
scrub.max=Math.max(0,frames.length-1);
function prepare(i){
 loaded=i;plans=svgTween(scene,frames[i],frames[Math.min(i+1,frames.length-1)]);
 const svg=scene.querySelector("svg");
 // Trim unused sky and floor; every recorded body stays within this view.
 svg.setAttribute("viewBox","0 140 960 360");svg.setAttribute("height","360");
}
function draw(){
 index=Math.floor(playhead);if(index!==loaded)prepare(index);
 const fraction=playhead-index;
 drawTween(plans,fraction);
 scrub.value=index;document.getElementById('position').textContent=(frames.length?index+1:0)+' / '+frames.length;
}
function frame(){return scene.querySelector('svg')?.outerHTML||'';}
scrub.oninput=()=>{playhead=+scrub.value;last=null;draw();};
play.onclick=()=>{playing=!playing;last=null;play.textContent=playing?'Pause':'Play';};
function pauseReplay(){playing=false;last=null;play.textContent='Play';}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseReplay();});
window.addEventListener('message',event=>{if(event.source===window.parent&&event.origin===location.origin&&event.data==='pause-replay')pauseReplay();});
function tick(t){
 if(playing&&frames.length>1){
  if(last!==null)playhead=(playhead+(t-last)*fps*(+document.getElementById('speed').value)/1000)%(frames.length-1);
  last=t;draw();
 }else last=null;
 requestAnimationFrame(tick);
}
draw();requestAnimationFrame(tick);
document.getElementById('save').onclick=()=>{if(!frames.length)return;const url=URL.createObjectURL(new Blob([frame()],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='frame-'+String(index).padStart(4,'0')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
}loadReplay().catch(()=>{document.getElementById('scene').textContent='This replay needs a browser with DecompressionStream support. Use a recent Chrome, Edge, Firefox or Safari.';});</script></html>
