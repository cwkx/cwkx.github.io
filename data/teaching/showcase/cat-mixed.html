const numbers=/[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/g;
function svgTween(scene,from,to){
 const plans=[];
 function pair(a,b){
  for(const name of ['transform','d','points','x','y','cx','cy','r','rx','ry','width','height','opacity','x1','x2','y1','y2']){
   const start=a.getAttribute(name),end=b.getAttribute(name);

 const next=new DOMParser().parseFromString(to||'<svg/>','image/svg+xml');
 const targets=new Map([...next.querySelectorAll('[data-animate]')].map(n=>[n.dataset.animate,n]));
 for(const a of scene.querySelectorAll('[data-animate]')){
  const b=targets.get(a.dataset.animate);
  if(!b||a.dataset.epoch!==b.dataset.epoch)continue;
  pair(a,b);
  const aa=[...a.querySelectorAll('*')],bb=[...b.querySelectorAll('*')];
  if(aa.length===bb.length&&aa.every((n,j)=>n.tagName===bb[j].tagName))aa.forEach((n,j)=>pair(n,bb[j]));
